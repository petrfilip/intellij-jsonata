# Don't bundle the Kotlin stdlib — the IntelliJ Platform provides it at runtime.
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m

# IntelliJ Platform 2024.3 runs on Java 21, so the plugin is compiled with a JDK 21 toolchain.
# No machine-specific JDK path is committed: the foojay-resolver plugin (settings.gradle.kts)
# auto-provisions a JDK 21 when none is found, and CI also provides one via setup-java. To reuse a
# local JDK/JBR 21 and skip that download, add its path to ~/.gradle/gradle.properties
# (uncommitted, machine-specific) — Gradle does not auto-detect JBRs inside .app bundles — e.g.:
#   org.gradle.java.installations.paths=/Applications/Android Studio.app/Contents/jbr/Contents/Home
org.gradle.caching = true
# Configuration cache kept off for now to avoid friction with the IntelliJ plugin tasks.
org.gradle.configuration-cache = false

name: Release

# Fires when you publish a GitHub Release (e.g. tag v0.1.0). The plugin is signed and
# pushed to the JetBrains Marketplace automatically, then the signed ZIP is attached to
# the GitHub Release. Can also be triggered manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Sign & publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # publishPlugin signs the artifact and uploads it. Requires these repository secrets
      # (Settings ▸ Secrets and variables ▸ Actions):
      #   CERTIFICATE_CHAIN     – contents of chain.crt
      #   PRIVATE_KEY           – contents of private.pem
      #   PRIVATE_KEY_PASSWORD  – password for the private key
      #   PUBLISH_TOKEN         – Marketplace token (plugins.jetbrains.com ▸ My Tokens)
      - name: Publish plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Attach signed ZIP to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*-signed.zip --clobber

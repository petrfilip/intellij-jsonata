name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IntelliJ Platform 2024.3 needs Java 21. setup-java provides it and exports JAVA_HOME,
      # which the Gradle toolchain (jvmToolchain(21)) auto-detects. The local-only JBR path in
      # gradle.properties is simply ignored here (non-existent path -> skipped).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Test
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  verify:
    name: Plugin Verifier (cross-IDE compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Confirms the plugin loads against the recommended set of IDEs (PyCharm, WebStorm,
      # GoLand, …), not just IntelliJ IDEA. Reports land in build/reports/pluginVerifier/.
      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
